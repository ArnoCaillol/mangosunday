<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 208 208" width="208" height="208"
     role="img" aria-label="Mango Sunday">
  <title>Mango Sunday — logo provisoire</title>
  <!--
    LOGO PROVISOIRE. À remplacer par le vectoriel du groupe.
    Il suffit d'écraser ce fichier : aucune modification de code n'est
    nécessaire, index.html pointe déjà sur /assets/img/logo.svg.
    Conserver un format carré et un fond opaque.
  -->
  <defs>
    <clipPath id="cadre">
      <rect x="10" y="10" width="188" height="188" rx="20"/>
    </clipPath>
  </defs>

  <!-- Panneau -->
  <rect x="10" y="10" width="188" height="188" rx="20" fill="#F6EEDC"/>

  <g clip-path="url(#cadre)">
    <!-- Ciel -->
    <rect x="10" y="10" width="188" height="96" fill="#E7D6B4"/>

    <!-- Soleil -->
    <circle cx="104" cy="76" r="34" fill="#E29A26" stroke="#1E1A16" stroke-width="4"/>

    <!-- Bandes du couchant, sous le soleil -->
    <g fill="#1E1A16" opacity="0.92">
      <rect x="60" y="66"  width="88" height="4"/>
      <rect x="66" y="78"  width="76" height="4"/>
      <rect x="74" y="90"  width="60" height="4"/>
    </g>

    <!-- Palmiers, en silhouette -->
    <g fill="#8A6A50">
      <rect x="40" y="70" width="4" height="40"/>
      <path d="M42 70 q-16 -6 -22 4 q14 -2 22 4 z"/>
      <path d="M42 70 q16 -6 22 4 q-14 -2 -22 4 z"/>
      <path d="M42 70 q-6 -14 4 -20 q0 12 -4 20 z"/>
      <rect x="166" y="76" width="4" height="34"/>
      <path d="M168 76 q-14 -5 -19 4 q12 -2 19 3 z"/>
      <path d="M168 76 q14 -5 19 4 q-12 -2 -19 3 z"/>
    </g>

    <!-- Montagnes -->
    <path d="M10 110 L54 84 L86 110 L120 88 L160 110 L198 92 L198 118 L10 118 Z" fill="#8A6A50"/>

    <!-- Bandeau du wordmark -->
    <path d="M10 112 L198 100 L198 146 L10 158 Z" fill="#FDFAF2"/>
    <!-- textLength force le wordmark a tenir dans le cadre quelle que
         soit la police systeme utilisee pour le rendu. -->
    <text x="104" y="137" transform="rotate(-3.6 104 133)"
          text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="22" font-weight="700" fill="#1E1A16"
          textLength="156" lengthAdjust="spacingAndGlyphs">MANGO SUNDAY</text>

    <!-- Bandes du bas : mangue, orange, terracotta -->
    <g>
      <rect x="10" y="156" width="188" height="7"  fill="#E29A26"/>
      <rect x="10" y="166" width="188" height="9"  fill="#D2652F"/>
      <rect x="10" y="178" width="188" height="11" fill="#B5563A"/>
    </g>

    <!-- Horizon sombre -->
    <path d="M10 190 q30 -8 56 0 q28 8 56 -2 q30 -8 76 2 L198 198 L10 198 Z" fill="#1E1A16"/>

    <!-- Mention de provisoire : disparaît avec le fichier définitif -->
    <rect x="52" y="16" width="104" height="16" rx="4" fill="#99422A"/>
    <text x="104" y="28" text-anchor="middle" font-family="Consolas, monospace"
          font-size="9.5" letter-spacing="1.4" fill="#F6EEDC">LOGO PROVISOIRE</text>
  </g>

  <!-- Cadre épais : le vocabulaire de badge de la charte -->
  <rect x="10" y="10" width="188" height="188" rx="20"
        fill="none" stroke="#1E1A16" stroke-width="8"/>
</svg>
